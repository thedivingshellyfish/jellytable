# Publishes jellytable on GitHub Pages: index.html (+ assets, docs).
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that index.html is up to date
        run: |
          cp index.html /tmp/committed.html
          python3 build.py
          cmp index.html /tmp/committed.html || { echo "index.html is out of date - run python3 build.py and commit"; exit 1; }
      - name: Assemble site
        run: mkdir -p site && cp -r index.html assets docs samples site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
