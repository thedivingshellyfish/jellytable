# Publishes jellytable on GitHub Pages: index.html (+ assets, docs, samples).
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"
# Two jobs (build, deploy) like the jellyqda website workflow.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that index.html is up to date
        run: |
          cp index.html /tmp/committed.html
          python3 build.py
          cmp index.html /tmp/committed.html || { echo "index.html is out of date - run python3 build.py and commit"; exit 1; }

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r index.html assets docs samples site/

      - uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
