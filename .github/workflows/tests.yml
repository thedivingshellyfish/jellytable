# Runs the browser tests (Chromium + Firefox) on every push and pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that index.html is up to date
        run: |
          cp index.html /tmp/committed.html
          python3 build.py
          cmp index.html /tmp/committed.html || { echo "index.html is out of date - run python3 build.py and commit"; exit 1; }

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox

      - name: Run tests in Chromium and Firefox
        run: npm test
