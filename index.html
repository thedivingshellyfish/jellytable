<style>
/* jellytable :: style.css -- jellyqda look: tokens, dark/light via data-theme */
:root {
  --bg: #0b1020; --bg2: #0f1629; --card: #141c33; --card2: #1a2440; --line: #26324f; --line2: #33426a;
  --text: #eef2ff; --text2: #b8c2dc; --muted: #8590b0;
  --accent: #8b7cf6; --accent2: #38bdf8; --good: #34d399; --warn: #fbbf24; --bad: #f87171;
  --shadow: 0 10px 30px rgba(0,0,0,.35); --gloss: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 55%);
  --radius: 16px; --bar: 60px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f6fb; --bg2: #eceffa; --card: #ffffff; --card2: #f4f5fb; --line: #e1e5f2; --line2: #cdd3e6;
  --text: #141a2e; --text2: #3d4766; --muted: #626c88;
  --accent: #6d5ce8; --accent2: #0284c7; --good: #047857; --warn: #a16207; --bad: #dc2626;
  --shadow: 0 8px 24px rgba(20,26,46,.08); --gloss: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0) 60%);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent2); }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; }

/* ---------- Menüzeile (bleibt sichtbar) ---------- */
.bar { position: sticky; top: 0; z-index: 30; height: var(--bar); display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); flex: none; }
.brand svg { width: 36px; height: 36px; filter: drop-shadow(0 4px 10px rgba(139,124,246,.45)); }
.brand b { font-size: 17px; letter-spacing: -.02em; display: block; line-height: 1.1; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.fileinfo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; margin-left: 8px; }
.fname { min-width: 60px; max-width: 360px; width: 100%; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 6px 9px; font-weight: 700; text-overflow: ellipsis; }
.fname:hover, .fname:focus { border-color: var(--line2); background: var(--card); outline: none; }
.pill { font-size: 11px; font-weight: 750; padding: 3px 9px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--text2); white-space: nowrap; }
.pill.dirty { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.ib { height: 38px; min-width: 38px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; color: var(--text2); font-weight: 700; font-size: 13px; }
.ib:hover { color: var(--text); border-color: var(--line2); }
.ib:disabled { opacity: .4; cursor: default; }
.ib.primary { background: linear-gradient(135deg, var(--accent), #6d8cf6); border: none; color: #fff; position: relative; overflow: hidden; }
.ib.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%); pointer-events: none; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
@media (max-width: 860px) { .ib .lbl { display: none; } .brand small { display: none; } }
@media (max-width: 560px) { .brand b { display: none; } .fileinfo .pill { display: none; } .bar { gap: 6px; padding: 0 8px; } .tools { gap: 4px; } .ib { min-width: 34px; height: 34px; padding: 0 7px; } .sep { display: none; } }

/* ---------- Allgemein ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 13px; padding: 10px 16px; min-height: 44px; border: 1px solid var(--line2); background: var(--card2); font-weight: 700; cursor: pointer; color: var(--text); text-decoration: none; }
.btn.primary { background: linear-gradient(135deg, var(--accent), #6d8cf6); border: none; color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn.ghost { background: none; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13.5px; transition: all .25s; pointer-events: none; z-index: 80; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Startseite ---------- */
.start { max-width: 920px; margin: 0 auto; padding: 22px 16px 40px; }
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; margin-bottom: 16px; border: 1px solid var(--line); box-shadow: var(--shadow);
  background: radial-gradient(120% 140% at 0% 0%, rgba(139,124,246,.36), transparent 55%), radial-gradient(120% 140% at 100% 100%, rgba(56,189,248,.28), transparent 50%), var(--card); }
.hero::after { content: ""; position: absolute; inset: 0; background: var(--gloss); pointer-events: none; }
.hero .row { display: flex; gap: 18px; align-items: center; position: relative; z-index: 1; }
.hero svg.big { width: 84px; height: 84px; flex: none; filter: drop-shadow(0 8px 18px rgba(139,124,246,.5)); }
.hero h1 { margin: 0 0 4px; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--text2); }
.hero .joke { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.privacy { display: flex; gap: 12px; align-items: flex-start; background: color-mix(in srgb, var(--accent2) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent2) 35%, var(--line)); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.privacy b { display: block; }
.step { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.step > div:not(.sn) { flex: 1; min-width: 0; }
.step h2 { margin: 3px 0 10px; font-size: 17px; }
.sn { width: 34px; height: 34px; border-radius: 11px; flex: none; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.orients { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .orients { grid-template-columns: 1fr; } .orient svg { width: 78px; height: 52px; } }
.orient { text-align: left; border: 1.5px solid var(--line2); background: var(--card); border-radius: 16px; padding: 14px; cursor: pointer; display: flex; gap: 14px; align-items: center; color: var(--text); }
.orient svg { width: 110px; height: 72px; flex: none; }
.orient b { display: block; font-size: 15px; }
.orient small { color: var(--text2); font-size: 12.5px; }
.orient.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.check { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border: 2px dashed var(--line2); border-radius: 16px; padding: 26px 14px; cursor: pointer; background: color-mix(in srgb, var(--accent) 5%, var(--card)); }
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.drop .dic { font-size: 30px; }
.formats { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
.formats span { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--text2); }
.err { margin-top: 12px; border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--bad) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); font-size: 14px; }
.feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 6px; }
.feat div { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); font-size: 13px; color: var(--text2); }
.feat b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
.foot a { color: var(--muted); }

/* ---------- Browser-Ansicht ---------- */
.browser { display: grid; grid-template-columns: var(--sidew, 300px) minmax(0, 1fr); height: calc(100vh - var(--bar)); height: calc(100dvh - var(--bar)); }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg2); position: relative; }
.side .head { padding: 12px; border-bottom: 1px solid var(--line); }
.side .head .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.search { position: relative; }
.search input { width: 100%; border-radius: 11px; border: 1px solid var(--line2); background: var(--card); padding: 8px 10px 8px 34px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.items { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 0; }
.it { display: flex; align-items: center; gap: 8px; border-radius: 11px; padding: 7px 8px; cursor: pointer; position: relative; }
.it:hover { background: var(--card); }
.it.on { background: color-mix(in srgb, var(--accent) 16%, var(--card)); box-shadow: inset 3px 0 0 var(--accent); }
.it .num { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
.it .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 14px; }
.it .nm.ph { color: var(--muted); font-style: italic; font-weight: 500; }
.it .fill { width: 34px; height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; flex: none; }
.it .fill i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.it .acts { display: none; gap: 2px; }
.it:hover .acts, .it.on .acts { display: flex; }
.it .acts button, .mini { border: 0; background: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.it .acts button:hover, .mini:hover { background: var(--card2); color: var(--text); }
.it input.rn { flex: 1; min-width: 0; border: 1px solid var(--accent); background: var(--card); border-radius: 8px; padding: 3px 7px; outline: none; font-weight: 600; }
.side .foot2 { padding: 10px; border-top: 1px solid var(--line); }
.side .foot2 .btn { width: 100%; }
.main { overflow-y: auto; min-height: 0; padding: 18px 22px 40px; }
.ihead { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.ihead h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; flex: 1; min-width: 200px; cursor: text; border-radius: 8px; padding: 2px 4px; margin-left: -4px; word-break: break-word; }
.ihead h1:hover { background: var(--card); }
.ihead h1 .ph { color: var(--muted); font-style: italic; }
.ihead input.rn { flex: 1; min-width: 200px; font-size: 22px; font-weight: 700; border: 1px solid var(--accent); border-radius: 10px; background: var(--card); padding: 2px 8px; outline: none; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--text2); }
.chip b { color: var(--text); }
.dist { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; max-width: 560px; }
.dist .row { display: grid; grid-template-columns: minmax(60px, 180px) 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; }
.dist .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.dist .row i { display: block; height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.dist .row em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.etools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.etools label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); }
.etools select { border-radius: 9px; border: 1px solid var(--line2); background: var(--card2); padding: 6px 8px; max-width: 220px; }
.etools .search input { padding: 7px 10px 7px 34px; background: var(--card2); }
.etools .grow { flex: 1; }
.hint { font-size: 12.5px; color: var(--muted); margin: -4px 0 10px; }
.entries { list-style: none; margin: 0; padding: 0; max-width: 980px; }
.gap { display: flex; align-items: center; height: 18px; position: relative; }
.gap::before { content: ""; position: absolute; left: 44px; right: 40px; top: 50%; height: 1px; background: transparent; }
.gap:hover::before { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.add { width: 22px; height: 22px; border-radius: 7px; border: 1px dashed var(--line2); background: var(--card); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; margin-left: 12px; opacity: .55; position: relative; z-index: 1; }
.gap:hover .add, .add:focus { opacity: 1; color: var(--accent); border-color: var(--accent); }
.gap.edge { height: 34px; }
.gap.edge .add { opacity: 1; width: auto; padding: 0 10px; gap: 6px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 700; height: 26px; }
.entry { display: grid; grid-template-columns: 44px minmax(0, 1fr) 34px; gap: 8px; align-items: start; }
.ebox { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.elab { display: flex; min-width: 0; }
.elab input.lab { font-size: 12px; font-weight: 750; color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); border: 1px solid transparent; border-radius: 8px; padding: 2px 8px; max-width: 100%; min-width: 0; outline: none; }
.elab input.lab:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.elab input.lab:focus { border-color: var(--accent); background: var(--card); }
.elab input.lab::placeholder { color: var(--muted); font-weight: 600; }
.elab .pos { font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 2px 2px; cursor: help; }
.entry .no { font-size: 12px; color: var(--muted); text-align: right; padding-top: 32px; font-variant-numeric: tabular-nums; }
.entry textarea { width: 100%; max-width: 100%; justify-self: start; resize: vertical; min-height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); padding: 9px 11px; line-height: 1.45; outline: none; overflow: hidden; }
.entry textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.entry textarea.empty { background: transparent; border-style: dashed; }
.entry textarea.changed { border-color: color-mix(in srgb, var(--warn) 60%, var(--line)); }
.entry .del { width: 30px; height: 30px; margin-top: 27px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.entry .del:hover { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, transparent); }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 16px 0 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.sidetoggle { display: none; }
@media (max-width: 760px) {
  .browser { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 25; top: var(--bar); left: 0; bottom: 0; width: min(86vw, 330px); transform: translateX(-102%); transition: transform .25s; box-shadow: var(--shadow); }
  .browser.sideopen .side { transform: none; }
  .sidetoggle { display: inline-flex; }
  .main { padding: 14px 12px 40px; }
  .entry { grid-template-columns: 26px minmax(0, 1fr) 32px; }
}

/* ---------- Dialoge ---------- */
dialog { border: 1px solid var(--line2); border-radius: 18px; background: var(--card); color: var(--text); padding: 0; width: min(560px, calc(100vw - 24px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(5, 8, 20, .55); backdrop-filter: blur(3px); }
dialog .dh { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }

<body>
<header class="bar" id="bar"></header>
<div id="view"></div>
<input type="file" id="file" accept=".csv,.tsv,.tab,.txt,.xlsx,.xlsm,.ods,.xml,.xls" hidden>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* jellytable :: formats.js -- read and write table files, all in the browser.
   No libraries: ZIP via (De)CompressionStream, XML via DOMParser.
   Reads:  CSV/TSV/TXT, XLSX/XLSM, ODS, Excel 2003 XML (SpreadsheetML)
   Writes: XLSX, ODS, CSV, TSV, Excel 2003 XML, JSON
   A table is always string[][] (rows of cells). */
(function () {
"use strict";
const F = {};
const enc = new TextEncoder();

/* ---------- ZIP ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

}

F.zip = async function (entries) {           // entries: [{name, data: string|Uint8Array, store?: bool}]
  const parts = [], central = [];
  let off = 0;
  const d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    if (!e.store && raw.length > 64) { const z = await deflateRaw(raw); if (z && z.length < raw.length) { data = z; method = 8; } }
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, method, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
    lh.setUint32(22, raw.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, method, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, raw.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, p) => a + p.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, entries.length, true); eo.setUint16(10, entries.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true);

F.unzip = function (buf) {

  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw F.err("notzip");
  const n = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);

  const files = new Map(), dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(off, true) !== 0x02014b50) throw F.err("notzip");
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
    off += 46 + nlen + elen + clen;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    files.set(name.replace(/^\/+/, ""), { method, data: u8.subarray(start, start + csize) });
  }

    has: (p) => files.has(p),
    names: () => Array.from(files.keys()),
    bytes: async (p) => { const e = files.get(p); if (!e) return null; if (e.method === 0) return e.data; if (e.method === 8) return inflateRaw(e.data); throw F.err("method"); },
    text: async function (p) { const b = await this.bytes(p); return b ? new TextDecoder().decode(b) : null; }
  };
};

/* ---------- Helfer ---------- */
F.err = (code) => { const e = new Error(code); e.code = code; return e; };
const xmlDoc = (s) => { const d = new DOMParser().parseFromString(s, "application/xml"); if (d.getElementsByTagName("parsererror").length) throw F.err("xml"); return d; };
const kids = (el, name) => el ? Array.from(el.children).filter((c) => c.localName === name) : [];
const xesc = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NUM = /^-?(0|[1-9]\d{0,14})(\.\d{1,15})?([eE][-+]?\d{1,3})?$/;
F.isNumber = (s) => NUM.test(s) && isFinite(+s);
const fmtNum = (v) => { const n = +v; if (!isFinite(n)) return String(v); return String(parseFloat(n.toPrecision(15))); };
F.rectangular = function (rows) {  // ragged -> rectangular, trailing empty rows/cols removed
  let w = 0, h = 0;
  rows.forEach((r, i) => { for (let j = r.length - 1; j >= 0; j--) if (r[j] !== "" && r[j] != null) { w = Math.max(w, j + 1); h = i + 1; break; } });
  return rows.slice(0, h).map((r) => { const o = new Array(w); for (let j = 0; j < w; j++) o[j] = r[j] == null ? "" : String(r[j]); return o; });
};

/* ---------- Text / CSV ---------- */
F.decode = function (bytes) {
  if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) return { text: new TextDecoder("utf-8").decode(bytes.subarray(3)), encoding: "UTF-8 (BOM)" };
  if (bytes[0] === 0xff && bytes[1] === 0xfe) return { text: new TextDecoder("utf-16le").decode(bytes.subarray(2)), encoding: "UTF-16 LE" };
  if (bytes[0] === 0xfe && bytes[1] === 0xff) return { text: new TextDecoder("utf-16be").decode(bytes.subarray(2)), encoding: "UTF-16 BE" };
  try { return { text: new TextDecoder("utf-8", { fatal: true }).decode(bytes), encoding: "UTF-8" }; }
  catch (e) { return { text: new TextDecoder("windows-1252").decode(bytes), encoding: "Windows-1252" }; }
};
F.detectDelimiter = function (text) {
  const cands = [",", ";", "\t", "|"], lines = [];
  let cur = "", q = false;
  for (let i = 0; i < text.length && lines.length < 30; i++) {
    const c = text[i];
    if (c === '"') q = !q;
    if (!q && (c === "\n" || c === "\r")) { if (cur) lines.push(cur); cur = ""; if (c === "\r" && text[i + 1] === "\n") i++; continue; }
    cur += c;
  }
  if (cur && lines.length < 30) lines.push(cur);
  let best = ",", bestScore = -1;
  for (const d of cands) {
    const counts = lines.map((l) => { let n = 0, inq = false; for (const c of l) { if (c === '"') inq = !inq; else if (c === d && !inq) n++; } return n; });
    if (!counts.length || Math.max(...counts) === 0) continue;
    const mode = counts.sort((a, b) => counts.filter((x) => x === b).length - counts.filter((x) => x === a).length)[0];
    const score = counts.filter((x) => x === mode).length * 10 + mode;
    if (mode > 0 && score > bestScore) { bestScore = score; best = d; }
  }
  return best;
};
F.parseCSV = function (text, delim) {
  const rows = []; let row = [], f = "", i = 0, q = false;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"' && f === "") { q = true; i++; continue; }
    if (c === delim) { row.push(f); f = ""; i++; continue; }
    if (c === "\r" || c === "\n") { row.push(f); rows.push(row); row = []; f = ""; i += c === "\r" && text[i + 1] === "\n" ? 2 : 1; continue; }
    f += c; i++;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }

};
F.toCSV = function (rows, delim, bom) {
  const esc = (v) => { v = v == null ? "" : String(v); return /["\r\n]/.test(v) || v.includes(delim) || /^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

};

/* ---------- XLSX lesen ---------- */
const colIndex = (ref) => { let n = 0; for (const ch of ref) { const c = ch.charCodeAt(0); if (c < 65 || c > 90) break; n = n * 26 + (c - 64); } return n - 1; };

  const ms = Math.round((serial - (d1904 ? -1462 : 0) - 25569) * 86400000);

  const t = p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + (d.getUTCSeconds() ? ":" + p(d.getUTCSeconds()) : "");

const relTarget = (base, target) => {
  if (target.startsWith("/")) return target.slice(1);

  for (const seg of target.split("/")) { if (seg === "..") parts.pop(); else if (seg !== ".") parts.push(seg); }

};
F.readXLSX = async function (buf) {
  const z = F.unzip(buf);

  const rootRels = await z.text("_rels/.rels");

  const shared = [];

/* ---------- ODS lesen ---------- */
const NS_T = "urn:oasis:names:tc:opendocument:xmlns:table:1.0", NS_O = "urn:oasis:names:tc:opendocument:xmlns:office:1.0", NS_X = "urn:oasis:names:tc:opendocument:xmlns:text:1.0";
function odsText(el) {
  let s = "";

    if (n.nodeType === 3) s += n.nodeValue;
    else if (n.nodeType === 1) {
      if (n.localName === "s") s += " ".repeat(+(n.getAttributeNS(NS_X, "c") || 1));
      else if (n.localName === "tab") s += "\t";
      else if (n.localName === "line-break") s += "\n";
      else if (n.localName === "annotation") continue;
      else s += odsText(n);
    }
  }
  return s;
}
F.readODS = async function (buf) {
  const z = F.unzip(buf);
  const xml = await z.text("content.xml");
  if (!xml) throw F.err("noworkbook");
  const doc = xmlDoc(xml);
  const tables = Array.from(doc.getElementsByTagNameNS(NS_T, "table")).filter((t) => t.parentNode.localName === "spreadsheet");
  return {
    sheets: tables.map((t, i) => t.getAttributeNS(NS_T, "name") || "Sheet" + (i + 1)),
    load: async (idx) => {
      const rows = [];
      const walk = (el) => {
        for (const ch of el.children) {
          if (ch.localName === "table-row") {
            const rrep = Math.min(+(ch.getAttributeNS(NS_T, "number-rows-repeated") || 1), 100000);
            const cells = [];
            let pendingEmpty = 0;
            for (const c of ch.children) {
              if (c.localName !== "table-cell" && c.localName !== "covered-table-cell") continue;
              const rep = Math.min(+(c.getAttributeNS(NS_T, "number-columns-repeated") || 1), 16384);
              const type = c.getAttributeNS(NS_O, "value-type");
              let v = "";
              if (type === "float" || type === "percentage" || type === "currency") v = fmtNum(c.getAttributeNS(NS_O, "value"));
              else if (type === "date") v = (c.getAttributeNS(NS_O, "date-value") || "").replace("T", " ").replace(/(\.\d+)?$/, "").replace(/ 00:00:00$/, "").replace(/( \d\d:\d\d):00$/, "$1");
              else if (type === "time") { const m = /PT(\d+)H(\d+)M(\d+)/.exec(c.getAttributeNS(NS_O, "time-value") || ""); v = m ? m[1].padStart(2, "0") + ":" + m[2] + (m[3] !== "00" ? ":" + m[3] : "") : ""; }
              else if (type === "boolean") v = c.getAttributeNS(NS_O, "boolean-value") === "true" ? "TRUE" : "FALSE";
              else v = kids(c, "p").map(odsText).join("\n");
              if (v === "") { pendingEmpty += rep; continue; }
              for (let k = 0; k < pendingEmpty; k++) cells.push("");
              pendingEmpty = 0;
              for (let k = 0; k < rep; k++) cells.push(v);
            }
            for (let k = 0; k < rrep; k++) rows.push(cells.slice());
          } else if (/^table-(header-rows|row-group|rows)$/.test(ch.localName)) walk(ch);
        }
      };
      walk(tables[idx]);
      return rows;
    }
  };
};

/* ---------- Excel 2003 XML lesen ---------- */
F.readXML2003 = async function (text) {
  const doc = xmlDoc(text);
  const ws = Array.from(doc.getElementsByTagNameNS("*", "Worksheet"));
  if (!ws.length) throw F.err("unknown");
  const A = (el, a) => el.getAttributeNS("urn:schemas-microsoft-com:office:spreadsheet", a) || el.getAttribute("ss:" + a);
  return {
    sheets: ws.map((w, i) => A(w, "Name") || "Sheet" + (i + 1)),
    load: async (idx) => {
      const rows = [], table = kids(ws[idx], "Table")[0];
      let r = 0;
      for (const row of kids(table, "Row")) {
        if (A(row, "Index")) r = +A(row, "Index") - 1;
        const out = rows[r] = [];
        let c = 0;
        for (const cell of kids(row, "Cell")) {
          if (A(cell, "Index")) c = +A(cell, "Index") - 1;
          const data = kids(cell, "Data")[0];
          let v = data ? data.textContent : "";
          if (data && A(data, "Type") === "DateTime") v = v.replace("T", " ").replace(/(\.\d+)?$/, "").replace(/ 00:00:00$/, "").replace(/( \d\d:\d\d):00$/, "$1");
          if (data && A(data, "Type") === "Number") v = fmtNum(v);
          if (data && A(data, "Type") === "Boolean") v = v === "1" ? "TRUE" : "FALSE";
          out[c] = v; c += 1 + (+A(cell, "MergeAcross") || 0);
        }
        r++;
      }
      for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
      return rows;
    }
  };
};

/* ---------- Datei öffnen (Typ erkennen) ---------- */
F.open = async function (file) {
  const name = file.name, ext = (name.split(".").pop() || "").toLowerCase();
  const buf = await file.arrayBuffer(), u8 = new Uint8Array(buf);
  const isZip = u8[0] === 0x50 && u8[1] === 0x4b;
  const isOle = u8[0] === 0xd0 && u8[1] === 0xcf && u8[2] === 0x11 && u8[3] === 0xe0;
  if (isOle) throw F.err("xls");
  if (isZip) {
    const z = F.unzip(buf);
    if (z.has("content.xml") && (z.has("mimetype") || ext === "ods")) return Object.assign(await F.readODS(buf), { type: "ods" });
    if (z.names().some((n) => /^xl\//.test(n))) return Object.assign(await F.readXLSX(buf), { type: "xlsx" });

    seen.add(s.toLowerCase()); return s;

};
function xlsxSheet(rows, opt) {

    : opt.freezeCols > 0 ? '<sheetViews><sheetView workbookViewId="0"><pane xSplit="' + opt.freezeCols + '" topLeftCell="' + F.colName(opt.freezeCols) + '1" activePane="topRight" state="frozen"/></sheetView></sheetViews>' : "";

const FMT = {
